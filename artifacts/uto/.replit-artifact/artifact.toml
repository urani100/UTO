kind = "web"
previewPath = "/"
title = "UTO — Text Shape Studio"
version = "1.0.0"
id = "artifacts/uto"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24411

[services.development]
run = "pnpm --filter @workspace/uto run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/uto", "run", "build" ]
publicDir = "artifacts/uto/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24411"
BASE_PATH = "/"
